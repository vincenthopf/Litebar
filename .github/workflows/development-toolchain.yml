name: Development toolchain
on:
  push:
    branches: [rewrite/rust-native]
    paths: [.github/workflows/development-toolchain.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install pinned offline validation tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          root=$(rustc +1.98.1 --print sysroot)
          tar -C "$root" -czf rust-toolchain.tar.gz bin lib
          sha256sum rust-toolchain.tar.gz > rust-toolchain.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-validation-toolchain
          path: rust-toolchain.*
          retention-days: 1
          compression-level: 0
