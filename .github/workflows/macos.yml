name: Native macOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Record environment
        run: |
          mkdir -p evidence
          sw_vers > evidence/macos.txt
          xcodebuild -version > evidence/xcode.txt
          rustc --version > evidence/rust.txt
          git rev-parse HEAD > evidence/commit.txt
      - name: Build native application
        run: |
          set -o pipefail
          bash scripts/build-macos.sh 2>&1 | tee evidence/build.txt
      - name: Package application
        run: |
          arch=$(uname -m)
          ditto -c -k --sequesterRsrc --keepParent "dist/Litebar-$arch.app" "dist/Litebar-$arch.zip"
          shasum -a 256 "dist/Litebar-$arch.zip" > "dist/Litebar-$arch.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Litebar-${{ matrix.os }}
          path: |
            evidence/
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
